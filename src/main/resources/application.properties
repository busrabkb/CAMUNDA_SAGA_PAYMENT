server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/camunda_demo
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Embedded Process Engine: Camunda, Spring Boot icinde calisir (ayri Camunda sunucusu yok)
# schema-update=true: ACT_* tablolarini ilk acilista Camunda kendisi olusturur
camunda.bpm.database.schema-update=true
# Auto-deployment: classpath'teki *.bpmn dosyalari uygulama acilisinda deploy edilir
camunda.bpm.auto-deployment-enabled=true
